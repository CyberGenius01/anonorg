apiVersion: apps/v1
kind: Deployment
metadata:
  name: paas-api
spec:
  replicas: 3
  selector:
    matchLabels: {app: paas-api}
  template:
    metadata:
      labels: {app: paas-api}
    spec:
      containers:
        - name: api
          image: blockchain-paas/api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: paas-secrets
          readinessProbe:
            httpGet: {path: /health, port: 4000}
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits: {cpu: "1", memory: "1Gi"}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paas-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paas-api
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
